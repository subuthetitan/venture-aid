[pytest]
# WHY THIS FILE EXISTS
#
# Every test module does `from app... import ...`, which only resolves if the
# backend/ directory is on sys.path. `python -m pytest` puts the current
# directory on sys.path automatically, so running the suite by hand always
# worked. The bare `pytest` console script does NOT -- and that is exactly how
# CI invokes it:
#
#     docker compose exec -T api pytest -q || true
#
# So in CI all nine test modules failed to import with
# `ModuleNotFoundError: No module named 'app'`, pytest exited with
# "Interrupted: 9 errors during collection", and `|| true` swallowed it. The
# step went green having run zero tests -- for every pair, since the repo was
# created.
#
# `pythonpath` (pytest >= 7) puts backend/ on sys.path regardless of how pytest
# is invoked, so the suite behaves identically by hand, in CI, and in the
# container.
pythonpath = .
testpaths = tests
