services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ps26092
      POSTGRES_PASSWORD: ps26092
      POSTGRES_DB: ps26092
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ps26092"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://ps26092:ps26092@db:5432/ps26092
      OFFLINE_MODE: "false"
    env_file: [.env]
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
    volumes: ["./backend:/app", "./shared:/shared:ro"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build: ./frontend
    depends_on: [api]
    ports: ["5173:5173"]
    volumes: ["./frontend:/app", "/app/node_modules"]
    environment:
      VITE_API_BASE: http://localhost:8000
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
