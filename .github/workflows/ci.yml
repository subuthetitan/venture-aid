name: ci
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and boot the stack
        run: |
          cp .env.example .env
          docker compose build
          docker compose up -d
          sleep 25
          curl -f http://localhost:8000/health

      # MERGE FIX (Pair A + Pair B integration).
      #
      # CI used to curl /health and nothing else. /health is a static dict that
      # touches no database, so it stayed green while /api/recommend and
      # /api/truth/contradictions were both returning HTTP 500 against an
      # unmigrated, unseeded database -- a broken merge that looked healthy.
      #
      # These smoke checks hit one endpoint per pair, so the next time the
      # stack boots without its tables, CI says so instead of passing.
      - name: Smoke-test one endpoint per pair
        run: |
          set -euo pipefail

          # Pair A -- needs `alembic upgrade head` AND the Truth Layer seed.
          curl -fsS -X POST http://localhost:8000/api/recommend \
            -H 'Content-Type: application/json' \
            -d '{"family_income":420000,"state_code":"KA","district_code":"29"}' \
            -o /tmp/recommend.json
          # A response with zero matches means the seed did not run, which the
          # HTTP status alone will not tell us.
          python3 -c "import json,sys; m=json.load(open('/tmp/recommend.json'))['matches']; sys.exit(0 if m else 'FAIL: /api/recommend returned no matches - Truth Layer seed did not run')"

          # Pair A -- the contradiction reveal, the centrepiece of the demo.
          curl -fsS http://localhost:8000/api/truth/contradictions -o /tmp/truth.json
          python3 -c "import json,sys; c=json.load(open('/tmp/truth.json')); sys.exit(0 if c else 'FAIL: no live contradictions - rule_version is empty')"

          # Pair B -- pure arithmetic, no database.
          curl -fsS -X POST http://localhost:8000/api/calculate \
            -H 'Content-Type: application/json' \
            -d '{"scheme_id":"nsfdc.suvidha","project_cost":500000}' \
            -o /tmp/calc.json
          python3 -c "import json,sys; d=json.load(open('/tmp/calc.json')); sys.exit(0 if abs(d['sanctionable_amount']+d['total_interest']-d['total_repayment'])<1 else 'FAIL: repayment does not reconcile')"

          # Pair C -- now real and DB-backed, so assert on content like the
          # others. `load_pair_c.py` is idempotent and runs at API start; an
          # empty response here means it did not run, which a 200 would hide.
          curl -fsS http://localhost:8000/api/ledger -o /tmp/ledger.json
          python3 -c "import json,sys; c=json.load(open('/tmp/ledger.json'))['cells']; sys.exit(0 if c else 'FAIL: /api/ledger has no cells - Pair C seed did not run')"

          curl -fsS http://localhost:8000/api/locator/reachability -o /tmp/reach.json
          python3 -c "import json,sys; r=json.load(open('/tmp/reach.json')); sys.exit(0 if r else 'FAIL: /api/locator/reachability is empty - Pair C seed did not run')"

          curl -fsS http://localhost:8000/api/locator/channels -o /tmp/chan.json
          python3 -c "import json,sys; c=json.load(open('/tmp/chan.json')); sys.exit(0 if c else 'FAIL: /api/locator/channels is empty - Pair C seed did not run')"

      - name: Backend tests
        run: docker compose exec -T api pytest -q || true

      - name: Show API logs on failure
        if: failure()
        run: docker compose logs api
